; RGB Suite - muOS Applications-menu metadata, localized.
; muOS reads the entry whose key matches the active language name
; (settings/general/language -> share/language/<name>.json) and falls back to
; English if a language is absent.
;
; The NAME is a brand -> identical in every language, so [full]/[grid] just carry
; English (muOS falls back to it for all languages). Only the [help] description
; is translated, per muOS's 35 shipped languages.
; "RGB" and "Screen React" are product/feature names -> left untranslated.

